name: soccer-updates

on:
  schedule:
    # Every 3 hours, so the page is never far behind.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-updates
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Refresh the page
        run: python main.py

      - name: Upload page dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Save state
        if: always()
        run: |
          git config user.name "soccer-bot"
          git config user.email "soccer-bot@users.noreply.github.com"
          git add index.html || true
          git diff --staged --quiet || git commit -m "update: $(date -u +%F\ %H:%M)"
          git push || true
