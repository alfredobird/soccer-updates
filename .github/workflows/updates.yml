name: soccer-updates

on:
  schedule:
    # Every 30 minutes, all week.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite the page even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: soccer-updates
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install ${{ steps.browser-cache.outputs.cache-hit == 'true' && '' || '--with-deps' }} chromium

      - name: Refresh the page
        run: python main.py ${{ inputs.force && '--force' || '' }}

      - name: Upload page dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Commit the page if it changed
        run: |
          git config user.name "soccer-bot"
          git config user.email "soccer-bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change, nothing to commit."
          else
            git commit -m "update: $(date -u +%F\ %H:%M)"
            git push
          fi
