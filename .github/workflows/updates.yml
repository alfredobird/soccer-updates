name: soccer-updates

on:
  schedule:
    # Every 30 minutes. Cron is UTC; Puerto Rico is UTC-4 all year.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install ${{ steps.browser-cache.outputs.cache-hit == 'true' && '' || '--with-deps' }} chromium

      - name: Build the page and notify
        id: build
        run: python main.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Upload page dumps on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Commit the page
        env:
          DATA_CHANGED: ${{ steps.build.outputs.data_changed }}
        run: |
          git config user.name "soccer-bot"
          git config user.email "soccer-bot@users.noreply.github.com"
          git add index.html state.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          if [ "$DATA_CHANGED" = "true" ]; then
            git commit -m "data: $(date -u +%F\ %H:%M)"
          else
            git commit -m "refresh: $(date -u +%F\ %H:%M)"
          fi
          # Another run may have pushed while this one was scraping.
          git pull --rebase --autostash || true
          git push
