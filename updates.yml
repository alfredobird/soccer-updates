name: soccer-updates

on:
  schedule:
    # 7:00 AM and 7:00 PM Atlantic (AST is UTC-4, no DST in Puerto Rico)
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: soccer-updates
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Check for updates and notify
        run: python main.py ${{ inputs.force && '--force' || '' }}
        env:
          # Telegram (free). Leave the others unset.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Email fallback (also free). Only used if Telegram isn't configured.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Upload page dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Save state
        if: always()
        run: |
          git config user.name "soccer-bot"
          git config user.email "soccer-bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%F\ %H:%M)"
          git push || true
